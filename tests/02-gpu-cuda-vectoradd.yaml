# A real CUDA kernel: NVIDIA's vectorAdd sample adds two vectors on the GPU
# and exits non-zero if the result is wrong.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-cuda-vectoradd
  namespace: runai-oss-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04
          resources:
            limits:
              nvidia.com/gpu: 1
