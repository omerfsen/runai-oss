# The GPU reaches a plain pod. No runtimeClassName on purpose: this proves
# nvidia is containerd's default runtime (otherwise: "nvidia-smi: command
# not found" although the GPU is allocated).
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-nvidia-smi
  namespace: runai-oss-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: nvcr.io/nvidia/cuda:13.4.3-base-ubuntu24.04
          command: [bash, -c]
          args:
            - |
              set -e
              nvidia-smi -L | grep -q '^GPU 0'
              nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
              echo "PASS: driver injected, GPU visible"
          resources:
            limits:
              nvidia.com/gpu: 1
