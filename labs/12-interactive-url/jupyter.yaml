# JupyterLab with half a GPU, at https://jupyter-team-a.<runai-domain>.
# RUNAI_DOMAIN is replaced when applying (see README). The login token comes
# from Secret jupyter-token, never from this file. The certificate is issued
# by cert-manager from the lab CA (ClusterIssuer runai-ca).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: runai-team-a
spec:
  replicas: 1
  progressDeadlineSeconds: 1800   # the first pull is a 5 GB image
  selector:
    matchLabels: {app: jupyter}
  template:
    metadata:
      labels: {app: jupyter}
      annotations:
        gpu-fraction: "0.5"
    spec:
      # Without this, Kubernetes injects JUPYTER_PORT=tcp://<svc-ip>:80 for the
      # Service named "jupyter", Jupyter reads it as its port and crashes.
      enableServiceLinks: false
      containers:
        - name: lab
          image: quay.io/jupyter/pytorch-notebook:cuda12-2026-10-05
          ports: [{containerPort: 8888}]
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef: {name: jupyter-token, key: token}
          readinessProbe:
            httpGet: {path: /api, port: 8888}   # /api/status needs the token (403)
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: runai-team-a
spec:
  selector: {app: jupyter}
  ports: [{port: 80, targetPort: 8888}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
  namespace: runai-team-a
  annotations:
    cert-manager.io/cluster-issuer: runai-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jupyter-team-a.RUNAI_DOMAIN]
      secretName: jupyter-tls
  rules:
    - host: jupyter-team-a.RUNAI_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: jupyter, port: {number: 80}}
