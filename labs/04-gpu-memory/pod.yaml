# Ask for GPU memory in MiB instead of a fraction.
#
# 4094 = exactly 25% of a 16376 MiB card. On 3.0.20 a value that is not a
# whole percentage of the card (e.g. 4096 = 25.01%) is rounded up to 26% by
# the scheduler and then rejected by Run:ai's own admission webhook
# ("NvFractions memory request (4257Mi) does not match gpu-memory annotation
# value (4096 MiB)"): the pod never binds. See README.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-mem
  namespace: runai-team-a
  annotations:
    gpu-memory: "4094"
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvcr.io/nvidia/cuda:13.4.3-base-ubuntu24.04
      command: [bash, -c]
      args:
        - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader; sleep 3600
