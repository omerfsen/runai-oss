# A quarter of the GPU (~4 GB), then PyTorch tries to allocate 2 GB (fits)
# and 6 GB (does not). The limit is enforced by the driver, not by trust.
apiVersion: v1
kind: Pod
metadata:
  name: isolation
  namespace: runai-team-a
  annotations:
    gpu-fraction: "0.25"
spec:
  restartPolicy: Never
  containers:
    - name: torch
      image: pytorch/pytorch:2.14.1-cuda13.2-cudnn9-runtime
      command: [python3, -c]
      args:
        - |
          import torch
          free, total = torch.cuda.mem_get_info()
          print(f"visible GPU memory: {total / 2**30:.1f} GiB")
          for gib in (2, 6):
              try:
                  x = torch.empty(int(gib * 2**30), dtype=torch.uint8, device="cuda")
                  print(f"allocate {gib} GiB: OK")
                  del x; torch.cuda.empty_cache()
              except torch.OutOfMemoryError:
                  print(f"allocate {gib} GiB: CUDA out of memory")
