---
# Every version is pinned to a release number. No "latest", no "main": a
# moving tag makes the build unrepeatable. Update steps: ../CLAUDE.md.

# ── Host GPU driver (host.yml) ───────────────────────────────────────────
# Canonical's signed modules, not DKMS: they load with Secure Boot on.
# 615 matches CUDA 13.4. List: apt-cache search 'linux-modules-nvidia-.*-open-generic'
nvidia_driver_branch: "615"
nvidia_ctk_version: "1.20.1-1"

# ── k3d cluster (cluster.yml) ────────────────────────────────────────────
cluster_name: runai
# kubectl/helm context every add-on and Run:ai role uses. The VM track
# (vm-*.yml) sets it to the RKE2 cluster's context instead.
kube_context: "k3d-{{ cluster_name }}"
# nodeSelector for system services (GPU Operator controller, cert-manager,
# Prometheus, Run:ai). Empty on k3d (one node); the VM track pins them to the
# CPU node so the GPU node only runs GPU work.
system_node_selector: {}
# Run:ai 3.0 supports Kubernetes 1.35 to 1.37 (docs: support-matrix.md); newest.
k3s_version: v1.37.1-k3s1
# 0 = CPU-only cluster on the stock rancher/k3s image; N or "all" = GPUs.
gpus: 1
# Ports 80/443 bind to this address. Empty = first physical NIC with an IPv4
# address, else the interface carrying the default route (e.g. a bridge).
host_ip: ""
registry_mirror: ""        # docker.io pull-through mirror URL, optional
node_dns: ""               # e.g. 9.9.9.9 to override the node's resolver

# ── GPU node image, built locally (no registry needed) ───────────────────
cuda_tag: 13.4.3-base-ubuntu24.04
device_plugin_version: v0.20.1
node_image: "localhost/k3s-cuda:{{ k3s_version }}-cuda-{{ cuda_tag }}"
node_image_rebuild: false  # true = build again even if the tag exists

# ── Add-ons, one switch each ─────────────────────────────────────────────
install_gpu_operator: true
gpu_operator_version: v26.7.1   # Run:ai 3.0: 25.10 to 26.7.1; GPU fractions need 26.7.1
# false on k3d: the node shares the host kernel and the host has the driver.
# true only for real nodes with no host driver (also turns on its toolkit).
gpu_operator_install_driver: false
gpu_operator_driver_version: "615.71.09"   # used only when the operator installs the driver
# containerd for the operator's toolkit (when it installs the driver), from
# docs.rke2.io, with one deliberate difference: RKE2 recommends
# ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED=false, but Run:ai
# delivers a GPU fraction by injecting NVIDIA_VISIBLE_DEVICES into the
# container; with "false" fractional pods get no GPU at all (no /dev/nvidia*,
# "nvidia-smi: command not found"). Trade-off: an unprivileged pod could set
# that variable itself. Whole-GPU requests still use volume mounts.
gpu_operator_toolkit_env:
  - {name: CONTAINERD_SOCKET, value: /run/k3s/containerd/containerd.sock}
  - {name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED, value: "true"}
  - {name: ACCEPT_NVIDIA_VISIBLE_DEVICES_AS_VOLUME_MOUNTS, value: "true"}

install_cert_manager: true
cert_manager_version: v1.21.3
letsencrypt_email: ""      # empty = cert-manager without Let's Encrypt issuers

install_demo: true
demo_image: nginx:1.31.8-alpine
demo_host: ""              # e.g. demo.example.com; empty = no Ingress

# ── Run:ai (runai.yml) ───────────────────────────────────────────────────
runai_version: 3.0.20                 # charts runai-oss/control-plane and runai-oss/runai-cluster
prometheus_stack_version: 92.13.1     # kube-prometheus-stack; Run:ai needs 88.6.5+
# Empty = runai.<host-ip-with-dashes>.nip.io: resolves to the host IP, wildcard
# included, with no DNS setup. Run:ai needs an FQDN, an IP is not accepted.
runai_domain: ""
runai_admin_username: admin@runai.local
# The admin password comes from $RUNAI_ADMIN_PASSWORD; if that is empty, a
# random one is generated once and kept here (outside the repo, mode 0600).
runai_admin_password_file: "~/.config/runai-oss/admin-password"
runai_cluster_name: "{{ cluster_name }}"
