---
# VM track, part 2: Rocky Linux 10.2 prepared for RKE2, then RKE2 itself.
# The admin kubeconfig lands on the workstation as context rke2-<vm_name>.
#
#   ansible-playbook vm-guest.yml -e @vm.local.yml
- name: Add the VM to the inventory
  hosts: workstation
  gather_facts: false
  tasks:
    - name: Add {{ vm_name }}
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: rocky_guest
        ansible_host: "{{ vm_ip }}"
        ansible_user: rocky
        ansible_ssh_private_key_file: "{{ playbook_dir }}/.keys/{{ vm_name }}_ed25519"
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
      changed_when: false

- name: Prepare Rocky Linux and install RKE2
  hosts: rocky_guest
  become: true
  gather_facts: true
  roles:
    - rocky_base
    - rke2
