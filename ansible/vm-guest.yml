---
# VM track, part 2: Rocky Linux 10.2 prepared for RKE2 on both VMs, then an
# RKE2 server on the control-plane VM and an agent on the GPU VM. The admin
# kubeconfig lands on the workstation as context {{ kube_context }}.
#
#   ansible-playbook vm-guest.yml -e @vm.local.yml
- name: Add the VMs to the inventory
  ansible.builtin.import_playbook: vm-inventory.yml

- name: Prepare Rocky Linux
  hosts: rocky_guests
  become: true
  gather_facts: true
  roles:
    - rocky_base

# The server first: the agent needs its join token and API.
- name: RKE2 server
  hosts: rke2_server
  become: true
  gather_facts: false
  roles:
    - rke2

- name: RKE2 agent
  hosts: rke2_agent
  become: true
  gather_facts: false
  roles:
    - rke2
