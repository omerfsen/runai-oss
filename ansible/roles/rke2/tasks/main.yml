---
# Single-node RKE2 server on Rocky Linux 10. RPM install (the official
# installer has an EL10 repo), which also brings the rke2-selinux policy, so
# SELinux stays enforcing. Traefik is the ingress controller (RKE2's default
# since v1.36, set explicitly here), as on the k3d track.

- name: RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: RKE2 config
  ansible.builtin.copy:
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
    content: |
      write-kubeconfig-mode: "0600"
      ingress-controller: traefik
      tls-san:
        - {{ vm_ip }}
        - {{ vm_hostname }}
      kubelet-arg:
        # Run:ai's control plane starts ~40 pods at once; lift the 5 pulls/s limit.
        - registry-qps=0
  register: rke2_config

- name: Install RKE2 (RPM, pinned)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL 'https://raw.githubusercontent.com/rancher/rke2/{{ rke2_version | replace('+', '%2B') }}/install.sh' \
      | INSTALL_RKE2_METHOD=rpm INSTALL_RKE2_VERSION={{ rke2_version }} sh -
  args:
    executable: /bin/bash
    creates: /usr/bin/rke2

- name: Start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: "{{ 'restarted' if rke2_config.changed else 'started' }}"
    enabled: true

- name: Wait for the node to become Ready
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    get nodes --no-headers
  register: nodes
  until: "' Ready ' in nodes.stdout"
  retries: 60
  delay: 10
  changed_when: false

- name: Install the local-path StorageClass (pinned) and make it the default
  ansible.builtin.shell: |
    set -o pipefail
    k="/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    out=$($k apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml)
    $k patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' >/dev/null
    echo "$out"
  args: {executable: /bin/bash}
  register: local_path
  changed_when: "' created' in local_path.stdout or ' configured' in local_path.stdout"

- name: Put kubectl on the guest's PATH
  ansible.builtin.copy:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    remote_src: true
    mode: "0755"

- name: The login user's .kube directory
  ansible.builtin.file:
    path: "/home/{{ vm_user }}/.kube"
    state: directory
    owner: "{{ vm_user }}"
    mode: "0700"

- name: Give the login user a kubeconfig
  ansible.builtin.copy:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "/home/{{ vm_user }}/.kube/config"
    remote_src: true
    owner: "{{ vm_user }}"
    mode: "0600"

- name: Shell conveniences for the login user
  ansible.builtin.blockinfile:
    path: "/home/{{ vm_user }}/.bashrc"
    marker: "# {mark} kubectl (runai-oss)"
    block: |
      alias k=kubectl
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k

# ── Kubeconfig on the control node, as context rke2-<vm> ─────────────────
- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/rke2/rke2.yaml
  register: rke2_kubeconfig_raw
  no_log: true

- name: Write it on the control node, pointed at the VM, renamed
  ansible.builtin.copy:
    dest: "{{ rke2_kubeconfig }}"
    mode: "0600"
    content: >-
      {{ rke2_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ vm_ip ~ ':6443')
         | replace('name: default', 'name: ' ~ rke2_context)
         | replace('cluster: default', 'cluster: ' ~ rke2_context)
         | replace('user: default', 'user: ' ~ rke2_context)
         | replace('current-context: default', 'current-context: ' ~ rke2_context) }}
  delegate_to: localhost
  become: false
  no_log: true

# Merge into ~/.kube/config so every role can use --context {{ rke2_context }}.
- name: Merge it into ~/.kube/config
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p ~/.kube
    tmp=$(mktemp)
    KUBECONFIG=~/.kube/config:{{ rke2_kubeconfig }} kubectl config view --flatten > "$tmp"
    if ! cmp -s "$tmp" ~/.kube/config; then mv "$tmp" ~/.kube/config; chmod 600 ~/.kube/config; echo merged; else rm -f "$tmp"; fi
  args: {executable: /bin/bash}
  register: kube_merge
  changed_when: "'merged' in kube_merge.stdout"
  delegate_to: localhost
  become: false

- name: Report
  ansible.builtin.debug:
    msg: >-
      RKE2 {{ rke2_version }} up on {{ vm_hostname }}. From the workstation:
      kubectl --context {{ rke2_context }} get nodes
