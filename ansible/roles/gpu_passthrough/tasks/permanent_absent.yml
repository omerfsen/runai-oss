---
# Shared by the off and on-demand modes: make sure the permanent-mode config
# is gone. Nothing is unloaded live — the host may be using the card — so a
# card that is on vfio-pci right now only comes back after a reboot.

- name: Remove the permanent-mode config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/modprobe.d/blacklist-gpu-passthrough.conf
    - /etc/modprobe.d/vfio.conf
    - /etc/modules-load.d/vfio-pci.conf
  register: permanent_removed

- name: Rebuild the initrd without it
  ansible.builtin.command: "{{ initrd_rebuild_cmd }}"
  when: permanent_removed.changed
  changed_when: true

- name: Note whether a reboot is still owed
  ansible.builtin.set_fact:
    card_still_on_vfio: >-
      {{ current_drivers.results | map(attribute='stdout') | select('equalto', 'vfio-pci') | list | length > 0 }}
