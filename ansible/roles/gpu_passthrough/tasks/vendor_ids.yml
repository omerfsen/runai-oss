---
- name: Read vendor:device id for each function
  ansible.builtin.shell: |
    set -o pipefail
    v=$(cat /sys/bus/pci/devices/{{ item }}/vendor); d=$(cat /sys/bus/pci/devices/{{ item }}/device)
    echo "${v#0x}:${d#0x}"
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_pci_ids }}"
  register: gpu_vendor_device_ids
