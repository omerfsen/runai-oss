---
# Rocky Linux 10 prepared for RKE2 (docs.rke2.io/install/requirements):
# kernel-modules-extra for nf_conntrack, NetworkManager away from the CNI
# interfaces, higher inotify limits. SELinux stays enforcing: the RKE2 RPMs
# bring the rke2-selinux policy.

- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install the packages RKE2 needs on EL10
  ansible.builtin.dnf:
    name:
      - kernel-modules-extra      # nf_conntrack on RHEL 10 and derivatives
      - container-selinux
      - bash-completion
      - tar
      - policycoreutils-python-utils   # semanage, for local-path's SELinux label
    state: present

# The base kernel and kernel-modules-extra must match the running kernel,
# else nf_conntrack cannot load: reboot once if dnf pulled a newer kernel.
- name: Running kernel
  ansible.builtin.command: uname -r
  register: running_kernel
  changed_when: false

- name: Installed kernel-modules-extra versions
  ansible.builtin.command: rpm -q kernel-modules-extra --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n'
  register: extra_versions
  changed_when: false

- name: Reboot onto the kernel kernel-modules-extra was built for
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: running_kernel.stdout not in extra_versions.stdout_lines

- name: Load nf_conntrack
  community.general.modprobe:
    name: nf_conntrack
    state: present
    persistent: present

# Documented RKE2 known issue: NetworkManager otherwise manages the CNI's
# interfaces and pod networking breaks.
- name: Keep NetworkManager off the CNI interfaces
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    mode: "0644"
    content: |
      [keyfile]
      unmanaged-devices=interface-name:flannel*;interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
  register: nm_conf

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  when: nm_conf.changed

# firewalld would need every RKE2 port opened by hand; RKE2's docs recommend
# turning it off. Not installed in the GenericCloud image, but be sure.
- name: Stop firewalld if present
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false

# GPU Operator, Run:ai and Prometheus watch many files (RKE2 requirements page).
- name: Raise the inotify limits
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    reload: true
  loop:
    - {key: fs.inotify.max_user_instances, value: "8192"}
    - {key: fs.inotify.max_user_watches, value: "524288"}
  loop_control: {label: "{{ item.key }}"}

# local-path-provisioner's helper pod creates volume directories under
# /opt/local-path-provisioner. With SELinux enforcing, a container may not
# write under /opt ("mkdir: ... Permission denied", PVCs stuck Pending), so the
# directory gets the container_file_t type, registered with semanage so a
# relabel keeps it. SELinux itself stays enforcing.
- name: Is local-path's directory labelled for containers?
  ansible.builtin.shell: |
    set -o pipefail
    semanage fcontext -l | grep -F '/opt/local-path-provisioner(/.*)?' | grep -q container_file_t
  args: {executable: /bin/bash}
  register: lp_fcontext
  changed_when: false
  failed_when: false

- name: Label it container_file_t
  ansible.builtin.command: semanage fcontext -a -t container_file_t '/opt/local-path-provisioner(/.*)?'
  when: lp_fcontext.rc != 0
  changed_when: true

- name: Create local-path's directory
  ansible.builtin.file:
    path: /opt/local-path-provisioner
    state: directory
    mode: "0755"

- name: Apply the label
  ansible.builtin.command: restorecon -Rv /opt/local-path-provisioner
  register: lp_restorecon
  changed_when: lp_restorecon.stdout | length > 0

# ── Password login (vm_cockpit / vm_ssh_password) ─────────────────────────
# Rocky's GenericCloud image turns Cockpit on, but nobody can log in: cloud-init
# locks the rocky password. Either give rocky a password, or mask Cockpit so no
# login page sits on the LAN.
- name: Password for rocky
  when: vm_cockpit or vm_ssh_password
  block:
    - name: Generate the VM password once
      ansible.builtin.copy:
        dest: "{{ vm_password_file | replace('~', lookup('ansible.builtin.env', 'HOME')) }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=20') }}"
        mode: "0600"
        force: false              # never overwrite: the password must not change
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    # Hashed on the guest: the control node's Python may lack crypt, which
    # password_hash needs. A salt fixed per host keeps the hash, and the user
    # task, unchanged on the next run.
    - name: Hash it
      ansible.builtin.command:
        cmd: openssl passwd -6 -salt {{ (inventory_hostname | hash('sha256'))[:16] }} -stdin
        stdin: "{{ lookup('ansible.builtin.file', vm_password_file | replace('~', lookup('ansible.builtin.env', 'HOME'))) }}"
      register: vm_password_hash
      changed_when: false
      no_log: true

    - name: Set it for rocky (root stays locked)
      ansible.builtin.user:
        name: rocky
        password: "{{ vm_password_hash.stdout }}"
      no_log: true

- name: Cockpit on or off
  ansible.builtin.systemd:
    name: cockpit.socket
    state: "{{ 'started' if vm_cockpit else 'stopped' }}"
    enabled: "{{ vm_cockpit }}"
    masked: "{{ not vm_cockpit }}"

# sshd takes the first value it reads, and drop-ins load in name order, so
# 40-* wins over cloud-init's 50-cloud-init.conf (PasswordAuthentication no).
- name: SSH password login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/40-runai-oss.conf
    mode: "0600"
    content: |
      PasswordAuthentication yes
  register: sshd_conf
  when: vm_ssh_password

- name: No SSH password login
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/40-runai-oss.conf
    state: absent
  register: sshd_conf_off
  when: not vm_ssh_password

- name: Check and reload sshd
  ansible.builtin.shell: sshd -t && systemctl reload sshd
  when: (sshd_conf is changed) or (sshd_conf_off is changed)
